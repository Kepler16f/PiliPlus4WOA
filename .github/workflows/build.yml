name: Build

# WOA 修改版：本 fork 只构建 / 发布 Windows ARM64。
# 上游原本按平台拆成 android / ios / mac / win_x64 / win_arm64 / linux_x64
# 六个 workflow，这里只保留 win_arm64，并把触发入口统一留在这个文件。
#
# 用法：Actions → Build → Run workflow
#   - tag 留空：只产出 artifact，不发 Release
#   - tag 填版本号（如 2.1.2_fix2）：额外创建同名 GitHub Release 并附上安装包
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    win_arm64:
        name: Release Windows ARM64
        uses: ./.github/workflows/win_arm64.yml
        permissions: write-all
        with:
            tag: ${{ github.event.inputs.tag }}
